            </div>

                <p>All done? <a href='index.html'>Back to the slime list!</a></p>
            </div>

        <script>
            document.getElementById('search').addEventListener('click', () => {
                const formData = new FormData();
                formData.append('name', document.getElementById('name').value);

                document.querySelectorAll('input[name="diet_ids"]:checked').forEach(cb => formData.append('diet_ids', cb.value));
                document.querySelectorAll('input[name="food_ids"]:checked').forEach(cb => formData.append('food_ids', cb.value));
                document.querySelectorAll('input[name="habitat_ids"]:checked').forEach(cb => formData.append('habitat_ids', cb.value));

                formData.append('is_two', document.getElementById('is_two').checked ? '1' : '0');
                formData.append('is_largo', document.getElementById('is_largo').checked ? '1' : '0');

                fetch("http://localhost/slimes/", { method: 'POST', body: formData })
                    .then(response => response.json().then(json => ({ status: response.status, json })))
                    .then(({ status, json }) => {
                        const errorContainer = document.getElementById('error-container');
                        errorContainer.innerHTML = '';

                        if (status === 400) {
                            json.messages.forEach(msg => {
                                const alert = document.createElement('div');
                                alert.className = 'alert alert-danger alert-dismissible fade show';
                                alert.innerHTML = `<strong>Error:</strong> ${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                                errorContainer.appendChild(alert);
                            });
                        } else if (status === 200) {
                            errorContainer.innerHTML = `<div class="alert alert-success">${json.message}</div>`;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert("Could not connect to the server.");
                    });
            });
        </script>
